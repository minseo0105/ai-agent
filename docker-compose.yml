# 오라클 클라우드 VM(Oracle Linux 9) / 로컬 공용.  사용법: docs/MIGRATION_ORACLE.md
#   cp .env.example .env.docker   # 값 채우기 (도메인은 .env의 SITE_ADDRESS, 아래 참고)
#   docker compose up -d --build
services:
  ailab:
    build: .
    image: ailab:latest
    container_name: ailab
    restart: always            # 앱이 죽거나 VM이 재부팅돼도 다시 켠다 (Docker 서비스가 enable 되어 있어야 함)
    # ports를 열지 않는다: 7860은 compose 내부망에서 Caddy만 접근한다
    expose:
      - "7860"
    networks:
      web:
        ipv4_address: 172.28.0.10
    # Dockerfile의 CMD(HF용 --forwarded-allow-ips "*")를 덮어써 Caddy 주소만 신뢰한다
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "7860", "--proxy-headers", "--forwarded-allow-ips", "172.28.0.2"]
    # .env(HF_TOKEN 등 다른 용도 값이 섞일 수 있음) 대신 전용 파일을 쓴다
    env_file:
      - .env.docker
    volumes:
      # SUPABASE_*를 쓰지 않을 때 관리자 설정/접속코드가 남는 곳
      - ailab-admin:/home/user/app/data/admin
    healthcheck:
      # /api/health는 외부 호출 없이 바로 답한다. slim 이미지에는 curl이 없어 python 사용
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # MONEY:ON 체험 (/moneyon). 원본은 HF Space, 출처는 apps/moneyon/SOURCE.md. 비밀값 없음
  moneyon:
    build:
      context: ./apps/moneyon
      dockerfile: Dockerfile.oracle
    image: moneyon:latest
    container_name: moneyon
    restart: always
    expose:
      - "7860"
    networks:
      web:
        ipv4_address: 172.28.0.11
    volumes:
      # 체험 장부 SQLite. 재빌드·컨테이너 재생성 후에도 남긴다(24시간 만료·KEEP 정리는 앱이 함)
      - moneyon-runtime:/home/user/app/runtime
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # STOCK:ON 키움 수집기(조회 전용). AI LAB 이미지를 쓰고 명령만 다르다. 키는 .env.stockon에만 있고
  # ailab 컨테이너에는 넣지 않는다. STOCKON_PRICE_SOURCE=public이면 키움을 부르지 않고 상태(만료일)만 쓴다.
  # 전환·복귀 방법: docs/STOCKON_PLAN.md '시연 당일 키움 전환'
  stockon-collector:
    image: ailab:latest
    container_name: stockon-collector
    restart: always
    command: ["python", "-m", "services.stockon.kiwoom_collector"]
    env_file:
      - path: .env.stockon
        required: false        # 파일이 없으면 public 모드로 상태만 쓴다
    networks:
      web:
        ipv4_address: 172.28.0.12
    volumes:
      - ailab-admin:/home/user/app/data/admin   # 스냅샷을 ailab과 같이 쓴다(market_kiwoom.json, kiwoom_status.json)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    container_name: ailab-caddy
    restart: always
    depends_on:
      - ailab
      - moneyon
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # 발급된 인증서 (지우면 재발급)
      - caddy-config:/config
    networks:
      web:
        ipv4_address: 172.28.0.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  web:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  ailab-admin:
  moneyon-runtime:
  caddy-data:
  caddy-config:
