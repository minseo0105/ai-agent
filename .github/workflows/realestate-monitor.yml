name: Real-estate monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      # ZIP:ON 전용 프로젝트가 등록돼 있으면 그쪽을 쓰고, 없으면 기존 설정으로 동작한다.
      ZIPON_SUPABASE_URL: ${{ secrets.ZIPON_SUPABASE_URL }}
      ZIPON_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZIPON_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install monitor dependencies
        run: pip install requests==2.34.2 streamlit==1.63.0
      - name: Run monitoring once
        run: python scheduler.py --once
