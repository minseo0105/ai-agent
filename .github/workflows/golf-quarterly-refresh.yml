name: Golf DB quarterly refresh

# 분기마다 골프장 공식 홈페이지를 다시 읽어 요금·캐디/카트비를 갱신하고 결과를 커밋한다.
# 매년 1·4·7·10월 1일 18:00 UTC (= 한국시간 2일 03:00). 수동 실행은 Actions 탭 → Run workflow.
on:
  schedule:
    - cron: "0 18 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용: 대상 골프장 수 제한 (0 = 전체)"
        default: "0"
      dry_run:
        description: "true면 DB를 저장하지 않고 보고서만 만든다"
        default: "false"

permissions:
  contents: write

concurrency:
  group: golf-quarterly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-golf-refresh.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-golf-refresh.txt
          python -m playwright install --with-deps chromium

      - name: Check secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::GitHub Secrets에 ANTHROPIC_API_KEY를 등록해 주세요 (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Run quarterly refresh
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.limit }}" != "" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/golf_quarterly_refresh.py $ARGS

      - name: Show report
        if: always()
        run: |
          REPORT=$(ls -t data/golf/enrichment_review/*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit updated DB and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/golf/*.json data/golf/enrichment_review/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(golf): 분기 DB 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
