name: Golf DB quarterly refresh

# 분기마다 골프장 공식 홈페이지를 다시 읽어 요금·캐디/카트비를 갱신하고 결과를 커밋한다.
# 매년 1·4·7·10월 1일 18:00 UTC (= 한국시간 2일 03:00). 수동 실행은 Actions 탭 → Run workflow.
# 2026-09-23 전체 수집을 마쳤으므로 2026년 10월 예약 실행은 건너뛰고 2027년 1월부터 자동 실행한다
# (아래 SCHEDULE_START_DATE. 수동 실행은 날짜와 관계없이 항상 동작).
on:
  schedule:
    - cron: "0 18 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용: 대상 골프장 수 제한 (0 = 전체)"
        default: "0"
      dry_run:
        description: "true면 DB를 저장하지 않고 보고서만 만든다"
        default: "false"

permissions:
  contents: write

concurrency:
  group: golf-quarterly-refresh
  cancel-in-progress: false

env:
  SCHEDULE_START_DATE: "2027-01-01"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$TODAY" < "$SCHEDULE_START_DATE" ]]; then
            echo "예약 실행 시작일($SCHEDULE_START_DATE) 전이라 이번 분기는 건너뜁니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-golf-refresh.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-golf-refresh.txt
          python -m playwright install --with-deps chromium

      - name: Check secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::GitHub Secrets에 ANTHROPIC_API_KEY를 등록해 주세요 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # 키 형식만 확인 (값은 출력하지 않음): 앞뒤 공백/따옴표/줄바꿈이 섞이면 401이 난다
          case "$ANTHROPIC_API_KEY" in
            sk-ant-*) ;;
            *) echo "::error::ANTHROPIC_API_KEY는 'sk-ant-'로 시작해야 합니다. 앞뒤 공백·따옴표 없이 다시 등록해 주세요."; exit 1 ;;
          esac
          if printf '%s' "$ANTHROPIC_API_KEY" | grep -q '[[:space:]"]'; then
            echo "::error::ANTHROPIC_API_KEY에 공백·줄바꿈·따옴표가 섞여 있습니다. 키 값만 다시 등록해 주세요."; exit 1
          fi

      - name: Run quarterly refresh
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.limit }}" != "" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/golf_quarterly_refresh.py $ARGS

      - name: Show report
        if: always()
        run: |
          REPORT=$(ls -t data/golf/enrichment_review/*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit updated DB and report
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/golf/*.json data/golf/enrichment_review/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(golf): 분기 DB 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
